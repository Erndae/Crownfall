<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<meta name="description" content="Crownfall: a street-style chess roguelike.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crownfall">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="apple-touch-icon" href="cf-touch-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="cf-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="cf-icon-192.png">
<style>html,body{margin:0;background:#1c1c1e}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Crownfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Permanent+Marker&family=Rubik:wght@400;500;700&family=MedievalSharp&family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#150f22; --bg-2:#1f1733; --bg-3:#2a2045; --line:#3d3063;
  --text:#f3ecff; --dim:#a697c9; --brass:#f0b64a; --chips:#3d8bff; --mult:#ff4a5c;
  --light:#6d5a96; --dark:#3f3163;
  --common:#8fa0b8; --uncommon:#3ecf8e; --rare:#ff5fb0;
  --display:"Chakra Petch","Arial Narrow",Arial,sans-serif;
  --body:"Rubik","Helvetica Neue",Arial,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(ellipse at 50% 0%, #2d1f4f 0%, transparent 65%);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;padding-inline:14px;padding-block:8px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1}
p{margin:0}
.muted{color:var(--dim)}
.money{color:var(--brass);font-family:var(--display);font-weight:700}
.btn{display:block;width:100%;box-sizing:border-box;min-width:0;border-radius:12px;padding:13px;font-family:var(--display);font-weight:700;font-size:20px;background:var(--brass);color:#2a1800;box-shadow:0 4px 0 #a8741c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8741c}
.btn.ghost{background:var(--bg-3);color:var(--text);box-shadow:0 4px 0 #120c1f;font-size:16px}
.btn.red{background:var(--mult);color:#fff;box-shadow:0 4px 0 #a01e2e}
.btn.blue{background:var(--chips);color:#fff;box-shadow:0 4px 0 #1d4fa8}
.btn[disabled]{opacity:.4;cursor:default}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.blindbox{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.blindbox .nm{font-family:var(--display);font-size:17px}
.blindbox .tg{font-size:12.5px;color:var(--dim)}
.blindbox .tg b{font-family:var(--display);color:var(--mult);font-size:16px}
.sidebox{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pill{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px}
.pill small{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.pill b{font-family:var(--display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.scoreRow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.scoreRow .lab{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.scoreRow .val{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pbar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--chips),var(--mult));transition:width .35s}
.calc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.calc .hand{grid-column:1/-1;text-align:center;font-family:var(--display);font-size:17px;min-height:20px;color:var(--text)}
.cbox{border-radius:10px;padding:6px;text-align:center;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;color:#fff}
.cbox.chips{background:var(--chips)} .cbox.mult{background:var(--mult)}
.calc .cap{display:block;text-align:center;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.calc .x{font-family:var(--display);font-size:24px;color:var(--dim)}
.bump{animation:bump .22s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}

/* relics */
.relics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.relic{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:9px;background:var(--bg-2);border:2px solid var(--common);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;box-sizing:border-box;text-align:center;overflow:hidden}
.relic.empty{border-style:dashed;border-color:var(--line);opacity:.5}
.relic .fx{font-family:var(--display);font-size:15px;line-height:1}
.relic .rn{font-size:9.5px;line-height:1.1;color:var(--dim)}
.relic svg{width:24px;height:24px}
.relic.uncommon{border-color:var(--uncommon)} .relic.rare{border-color:var(--rare)}
.relic.fire{animation:fire .35s ease}
@keyframes fire{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-8deg) scale(1.15)}60%{transform:rotate(6deg) scale(1.1)}100%{transform:none}}
.fxc{color:var(--chips)} .fxm{color:var(--mult)} .fxx{color:#ffd95e} .fxg{color:var(--brass)}

/* board */
.boardWrap{position:relative}
body{transition:background-color .6s}
#app{--light:#9a968f;--dark:#6b6763;--rim:#111;--glow:rgba(0,0,0,.45);--enemy:#ff3d9a}
body[data-mood="hunting"] #app{--light:#a58c88;--dark:#7a5c59;--rim:#ff3d9a;--glow:rgba(255,61,154,.4);--enemy:#ff3d9a}
body[data-mood="check"] #app{--light:#b76f69;--dark:#7e3834;--rim:#ff2a2a;--glow:rgba(255,42,42,.6);--enemy:#ff2a2a}
body[data-mood="cornered"] #app{--light:#88aaa4;--dark:#4f716c;--rim:#19e3c9;--glow:rgba(25,227,201,.45);--enemy:#9a9a9a}
.sq{transition:background-color .6s}
.board{transition:border-color .6s, box-shadow .6s}
.board{border-color:var(--rim);box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 26px var(--glow)}
body[data-mood="hunting"] .pc.en{animation:prowl 1.8s ease-in-out infinite}
body[data-mood="check"] .pc.en{animation:prowl .7s ease-in-out infinite}
body[data-mood="check"] .board{animation:alarm 1s ease-in-out infinite}
body[data-mood="cornered"] .pc.en{animation:tremble .35s linear infinite}
@keyframes prowl{0%,100%{transform:scale(1)}50%{transform:scale(1.07) translateY(-1px);filter:drop-shadow(0 0 4px var(--enemy))}}
@keyframes tremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-.6px)}75%{transform:translateX(.6px)}}
@keyframes alarm{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 12px var(--glow)}50%{box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 34px rgba(255,31,61,.9)}}
.moodrow{display:flex;align-items:center;gap:8px;min-height:24px}
.mood{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:14px;padding:3px 11px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);transition:all .4s}
.mood i{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.mood.hunting{border-color:#ff2d55;color:#ffb3c2} .mood.hunting i{background:#ff2d55;animation:blink 1.2s infinite}
.mood.check{border-color:#ff1f3d;background:#3a0d18;color:#fff} .mood.check i{background:#ff1f3d;animation:blink .5s infinite}
.mood.cornered{border-color:var(--brass);color:#ffe2a8} .mood.cornered i{background:var(--brass)}
@keyframes blink{50%{opacity:.25}}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:visible}
.shard{position:absolute;width:12px;height:12px}
.ring{position:absolute;border-radius:50%;border:4px solid var(--brass)}
.flash{position:absolute;background:#fff}
.soul{position:absolute}
.soul svg{width:100%;height:100%}
.brill{position:absolute;left:50%;top:42%;font-family:var(--display);font-size:clamp(26px,9vw,44px);color:var(--brass);text-shadow:0 4px 0 #6b2140,0 0 24px rgba(240,182,74,.8);white-space:nowrap;pointer-events:none;z-index:9}
.rageflash{animation:rage .6s ease-out}
@keyframes rage{0%{box-shadow:inset 0 0 0 0 rgba(255,31,61,0)}20%{box-shadow:inset 0 0 60px 20px rgba(255,31,61,.7)}100%{box-shadow:inset 0 0 0 0 rgba(255,31,61,0)}}
@media (prefers-reduced-motion: reduce){ .pc.en{animation:none!important} .board{animation:none!important} }
.board{display:grid;grid-template-columns:repeat(8,1fr);border-radius:10px;overflow:hidden;border:3px solid #2b2146;box-shadow:0 10px 30px rgba(0,0,0,.5);aspect-ratio:1;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sq{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq.sel{box-shadow:inset 0 0 0 3px var(--brass)}
.sq.threat::after{content:"";position:absolute;inset:3px;border:2px solid rgba(255,74,92,.85);border-radius:6px;pointer-events:none}
.sq.swapA{box-shadow:inset 0 0 0 3px var(--chips)}
.sq .dot{position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(240,182,74,.8)}
.sq .dot.risk{background:rgba(255,74,92,.9)}
.sq .ring{position:absolute;inset:6%;border-radius:50%;border:3px solid rgba(240,182,74,.9)}
.sq .ring.risk{border-color:rgba(255,74,92,.95)}
.sq .pv{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-family:var(--display);font-size:11px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none;z-index:3}
.pc{width:86%;height:86%;position:relative;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.coord{position:absolute;font-size:9px;color:rgba(255,255,255,.35);left:2px;top:1px}
.pop{position:absolute;z-index:10;font-family:var(--display);font-size:22px;pointer-events:none;text-shadow:0 2px 0 #000;animation:up .9s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes up{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions .btn{font-size:15px;padding:10px 6px}
.tipbar{font-size:13px;color:var(--dim);text-align:center;min-height:18px}
.tipbar b{color:var(--text)}

/* screens */
.screen{display:flex;flex-direction:column;gap:12px}
.logo{font-family:var(--display);font-size:clamp(54px,17vw,84px);line-height:.9;text-align:center;letter-spacing:.02em;text-shadow:0 5px 0 #6b2140}
.logo span{display:block;color:var(--brass);text-shadow:0 5px 0 #7a4d0e}
.blinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcard{background:var(--bg-2);border:2px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.bcard.cur{border-color:var(--brass)}
.bcard.done{opacity:.45}
.bcard .chip{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:#fff;border:3px dashed rgba(255,255,255,.4)}
.bcard b{font-family:var(--display);font-size:18px;color:var(--mult)}
.bcard small{font-size:11.5px;color:var(--dim);line-height:1.25}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.offer{background:var(--bg-2);border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.offer.common{border-color:var(--common)} .offer.uncommon{border-color:var(--uncommon)} .offer.rare{border-color:var(--rare)}
.offer.piece{border-color:#8f7cc8} .offer.train{border-color:var(--chips)}
.offer h3{font-size:17px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.offer .tagline{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.offer p{font-size:13px;color:#dcd2f5;flex:1}
.offer .btn{font-size:15px;padding:8px}
.offer.sold{opacity:.35}
.offer svg{width:34px;height:34px}
.cash{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.kv{display:flex;justify-content:space-between;font-size:14px}
.kv span{color:var(--dim)}
.kv b{font-family:var(--display);font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lv{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;align-items:center;gap:6px;font-size:12px}
.lv svg{width:28px;height:28px;flex:none}
.lv b{font-family:var(--display);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(8,4,16,.78);display:grid;place-items:center;z-index:30;padding-inline:16px}
.modal .box{width:100%;max-width:380px;background:var(--bg-2);border:2px solid var(--line);border-radius:16px;padding:18px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow:auto;animation:mp .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes mp{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:28px}
.tip{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d0818;border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:40;max-width:340px;width:calc(100% - 32px);box-sizing:border-box;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.tip b{font-family:var(--display);font-size:16px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#dcd2f5}
.rules b{color:var(--text)}
.play{height:100%;box-sizing:border-box;min-height:0;overflow:hidden;gap:6px!important;padding-block:6px 8px!important}
.phud{display:flex;gap:8px;align-items:stretch}
.pblind{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.pblind b{font-family:var(--display);font-size:15px;line-height:1.1}
.pblind span{font-size:12px;color:var(--dim)} .pblind em{font-style:normal;font-family:var(--display);color:var(--mult);font-size:14px}
.pblind small{font-size:10.5px;color:#ffb3bd;line-height:1.15}
.pstats{display:flex;gap:5px}
.pstats div{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:3px 7px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pstats small{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.pstats b{font-family:var(--display);font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.pscore{display:grid;grid-template-columns:1.1fr 1fr auto 1fr;gap:6px;align-items:center}
.pscore .sc{display:flex;flex-direction:column;line-height:1}
.pscore .sc small{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.pscore .sc b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.pscore .cbox{padding:3px 4px;font-size:22px;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.pscore .cbox small{font-family:var(--body);font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.pscore .cbox span{display:inline-block}
.pscore .x{font-family:var(--display);font-size:18px;color:var(--dim)}
.play .pbar{height:18px;position:relative;border-radius:5px}
.pbar .ptgt{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:10.5px;letter-spacing:.04em;color:#fff;text-shadow:0 0 3px #000,1px 1px 0 #000;white-space:nowrap;text-transform:uppercase}
.pbar .ptgt b{font-weight:400;color:#ffe14d;font-size:12px}
.pscore .cbox{position:relative;border:3px solid #0d0d0d}
.combo{position:absolute;top:-11px;right:-6px;font-style:normal;font-family:var(--display);font-size:9.5px;background:#ffe14d;color:#0d0d0d;border:2px solid #0d0d0d;border-radius:4px;padding:1px 4px;transform:rotate(4deg) scale(0);transition:transform .25s cubic-bezier(.2,1.8,.4,1);white-space:nowrap;pointer-events:none}
.combo.on{transform:rotate(4deg) scale(1)}
.handrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.handrow .hand{font-family:var(--display);font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handrow .mood{flex:none;font-size:11.5px;padding:2px 9px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play .relics{gap:5px}
.play .relic{aspect-ratio:auto;height:40px;flex-direction:row;gap:4px;padding:2px 4px}
.play .relic svg{display:none}
.play .relic .fx{font-size:13px}
.play .relic .rn{font-size:8.5px;text-align:left}
.play .relic.empty{height:40px}
.boardArea{flex:1;min-height:0;container-type:size;display:flex;justify-content:center;align-items:center}
.play .boardWrap{width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
.play .board{width:100%;height:100%;grid-template-rows:repeat(8,1fr);box-sizing:border-box}
.play .sq{aspect-ratio:auto}
.play .actions .btn{padding:8px 6px;font-size:14px;box-shadow:0 3px 0 #0b0716}
.play .actions .btn.blue{box-shadow:0 3px 0 #1d4fa8}
.actions.four{grid-template-columns:.95fr 1.1fr 1.1fr .75fr}
.actions.four #swapBtn,.actions.four #quit{white-space:nowrap;font-size:13px;padding-inline:4px}
.actions.four.five{grid-template-columns:.9fr .85fr 1fr 1fr .7fr;gap:6px}
.actions.five #swapBtn,.actions.five #trapBtn,.actions.five #quit{font-size:12px!important;padding-inline:2px!important;white-space:nowrap}
.actions.five .gmc{font-size:11px!important}
.btn.trapbtn{background:#ff7b1c!important;color:#0d0d0d!important}
.btn.trapbtn.red{background:#ff3d9a!important;color:#fff!important}
.btn.trapbtn.used{opacity:.45}
.gmc{background:var(--bg-3)!important;color:var(--text)!important;border:2px solid var(--cc,var(--line))!important;box-shadow:0 3px 0 #0b0716!important;display:flex!important;flex-direction:column;align-items:center;line-height:1.05;font-size:12.5px!important;padding:5px 4px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmc small{font-family:var(--body);font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--cc);opacity:.9}
.gmc.on{background:#2d2a12!important;box-shadow:0 0 14px var(--cc)!important}
.gmc.empty{border-style:dashed!important;opacity:.45;font-size:11px!important}
.offer.cardo{grid-column:1/-1;background:linear-gradient(135deg,var(--bg-2),#2b1f47)}
.cardrow{display:flex;flex-direction:column;gap:6px}
.cardrow .lab{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mycard{border:2px solid var(--cc,var(--line));border-radius:12px;background:linear-gradient(135deg,var(--bg-2),#2b1f47);padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:62px;box-sizing:border-box}
.mycard small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--cc,var(--dim))}
.mycard b{font-family:var(--display);font-size:16px;color:var(--text)}

/* ===== fit-to-screen safety ===== */
html{overflow-x:hidden} body{overflow-x:clip;max-width:100%;margin:0}
#app{width:100%;max-width:min(480px,100vw)}
.shopgrid,.circuits,.diffs,.cards2,.levels,.blinds,.setg,.lcrowns{grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))!important}
.diffs,.blinds,.levels,.setg.three,.lcrowns{--cols:3}
.offer,.circ,.diff,.bcard,.mycard,.lv,.landb,.lp,.gmc,.btn{min-width:0}
.offer h3{flex-wrap:wrap;overflow-wrap:anywhere;min-width:0}
.offer h3 svg,.offer .tileprev{flex:none}
.offer p,.circ .cab,.circ .ccards,.diff span,.bcard span,.mycard b,.armystrip .lab{overflow-wrap:anywhere}
.army{grid-template-columns:repeat(8,minmax(0,1fr))}
.landpick{grid-template-columns:repeat(5,minmax(0,1fr))}
.lp b{overflow-wrap:anywhere}
.modal .box{max-width:min(380px,100%)}
@media (max-width:360px){ .circuits{--cols:1} .offer h3{font-size:13px} .offer p{font-size:12px} .circ b{font-size:17px} }
.pinfo{height:auto!important;min-height:66px;max-height:128px;padding-block:6px!important}
.pinfo .pt{gap:2px;flex:1}
.pinfo .pt > b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo .pt span.cs{white-space:normal}
.pinfo .pt span.ab.pws{display:flex!important;flex-wrap:wrap;gap:3px 4px;-webkit-line-clamp:unset;white-space:normal}
.pinfo .pw{font-size:10.5px!important;line-height:1.2;color:#e9e4d9!important;background:#1f1e21;border:1.5px solid var(--ec);border-radius:4px;padding:1px 5px;white-space:nowrap!important}
.pinfo .pw b{color:var(--ec);font-family:var(--body);font-weight:700;font-size:10.5px}
@media (max-height:680px){ .pinfo{min-height:54px} }
.circ .cleared{font-size:11px;font-family:var(--display);color:#19e3c9}

.circ.road{grid-column:1/-1;background-image:linear-gradient(135deg,rgba(255,255,255,.04),transparent)}

.speech{position:absolute;left:4%;right:4%;top:6px;z-index:12;display:flex;gap:10px;align-items:center;background:#0d0d0d;border:3px solid var(--enemy,#ff3d9a);border-radius:10px;padding:8px 10px;box-shadow:4px 4px 0 rgba(0,0,0,.6);animation:spkin .35s cubic-bezier(.2,1.5,.4,1);transition:opacity .3s,transform .3s;cursor:pointer}
.speech.ruler{border-color:#ffd23d;box-shadow:0 0 18px rgba(255,210,61,.45),4px 4px 0 rgba(0,0,0,.6)}
.speech::after{content:"";position:absolute;bottom:-11px;left:34px;border:8px solid transparent;border-top-color:inherit;border-top-color:var(--enemy,#ff3d9a)}
.speech.ruler::after{border-top-color:#ffd23d}
.speech.out{opacity:0;transform:translateY(-6px)}

/* ===== relic tiles ===== */
.relics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.relic{min-width:0}
.relic,.relics .relic:nth-child(odd),.relics .relic:nth-child(even){transform:none}
.relic{--tile-bg:var(--tl,#d9d4ca);overflow:visible!important;aspect-ratio:1!important;height:auto!important;padding:3px!important;border:3px solid #0d0d0d!important;border-radius:5px!important;background:var(--tile-bg)!important;color:var(--tile-ink,#1c1a18);flex-direction:column!important;gap:0!important;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.35),inset -3px -3px 0 rgba(0,0,0,.28),3px 3px 0 rgba(0,0,0,.6)!important;
  background-image:linear-gradient(135deg,rgba(255,255,255,.18),transparent 45%),radial-gradient(rgba(0,0,0,.12) 1px,transparent 1.5px)!important;background-size:auto,5px 5px!important}
.relics > .relic:nth-child(even){--tile-bg:var(--td,#8f8a82);--tile-ink:#fff}
.relic::before{content:"";position:absolute;top:3px;left:3px;width:7px;height:7px;transform:rotate(45deg);background:var(--common);border:1.5px solid #0d0d0d}
.relic.uncommon::before{background:var(--uncommon)} .relic.rare::before{background:var(--rare)}
.relic.empty::before{display:none}
.relic.empty{background:transparent!important;background-image:none!important;border:3px dashed rgba(255,255,255,.18)!important;box-shadow:none!important;opacity:1}
.relic .rg{width:44%;height:44%;display:block!important;flex:none}
.relic .fx{position:absolute;right:-5px;bottom:-7px;font-size:11px!important;line-height:1;background:#0d0d0d;color:#fff;border-radius:4px;padding:2px 4px;font-family:var(--display)}
.relic .fx.fxc{color:#5fd0ff} .relic .fx.fxm{color:#ff7ab8} .relic .fx.fxx{color:#ffa45c} .relic .fx.fxg{color:#ffe14d}
.relic .rn{font-size:8.5px!important;line-height:1.05;margin-top:2px;color:inherit!important;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play .relics{grid-template-columns:repeat(5,42px);justify-content:center;gap:12px}
.play .relic,.play .relic.empty{height:42px!important;width:42px}
.play .relic .rn{display:none}

  if(!soundOn) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime; o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.0001, n+d); o.connect(g).connect(AC.destination); o.start(n); o.stop(n+d+0.02); }catch(e){}
}
function wood(freq, vol, len){
  if(!soundOn) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const n = AC.currentTime, dur = len || 0.07;
    const buf = AC.createBuffer(1, Math.floor(AC.sampleRate*dur), AC.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 4);
    const src = AC.createBufferSource(); src.buffer = buf;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 6;
    const g = AC.createGain(); g.gain.value = vol;
    src.connect(bp).connect(g).connect(AC.destination); src.start(n);
    const o = AC.createOscillator(), og = AC.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(freq*0.5, n); o.frequency.exponentialRampToValueAtTime(freq*0.25, n+dur);
    og.gain.setValueAtTime(vol*0.35, n); og.gain.exponentialRampToValueAtTime(0.0001, n+dur); o.connect(og).connect(AC.destination); o.start(n); o.stop(n+dur+0.02);
  }catch(e){}
}

function noise({type='highpass', f=3000, q=1, dur=0.1, vol=0.3, at=0, f2=null}={}){
  const a = ac(); if(!a) return; const n = a.currentTime + at;

// play-style adjustments to how the boss picks moves
function styleBonus(from, to){
  const pp = curPersona(); if(!pp) return 0;
  const b = B.board, mover = b[from], victim = b[to], nb = applyMove(b, from, to);
  const val = t => t === 'K' ? 400 : TYPE[t].val;
  const risky = attacksOn(nb, 'me').includes(to), rv = risky ? val(nb[to].t) : 0;
  const hits = attackSquares(nb, to).filter(x => nb[x] && nb[x].side === 'me');
  const mk = kingIdx(nb, 'me'), [kr, kc] = rc(mk >= 0 ? mk : 0), [tr, tc] = rc(to), kd = Math.max(Math.abs(kr-tr), Math.abs(kc-tc));
  let s = 0;
  switch(pp.style){
    case 'aggressive': s += (victim ? val(victim.t) * 0.35 : 0) + hits.length * 4 + rv * 0.3 + (rc(to)[0] - rc(from)[0]) * 2; break;
    case 'hunter': s += (inCheck(nb, 'me') ? 35 : 0) + (7 - kd) * 3 + hits.filter(x => nb[x].t === 'K').length * 10; break;
    case 'tricky': s += hits.length >= 2 ? hits.reduce((a, x) => a + val(nb[x].t) * 0.25, 0) + 10 : 0; if(mover.t === 'N' || mover.t === 'B') s += 3; break;
    case 'greedy': s += (victim ? val(victim.t) * 0.6 : 0) + rv * 0.35; break;
    case 'defensive': s -= rv * 0.6; if(attacksOn(b, 'me').includes(from) && !risky) s += val(mover.t) * 0.4; if(mover.t === 'K') s -= 6; break;
  }
  return s;
}

/* ---------- scoring ---------- */
const comboX = streak => 1 + 0.25 * Math.min(streak, 4);
function scoreCapture(from, to){
  const b = B.board, a = b[from].t, victim = b[to], v = victim ? victim.t : null;
  const nb = applyMove(b, from, to);
  const check = inCheck(nb, 'en');
  if(!victim && !check) return null;
  if(!victim && B.seen && B.seen[posKey(nb)]) return {steps:[], chips:0, mult:0, total:0, promo:false, check:true, label:'Repeated check · no points', fork:0, rep:true};
  const lv = RUN.lv[a], T0 = TYPE[a], steps = [];
  let chips, mult, vv = 0;
  if(victim){
    chips = T0.chips + T0.lc*(lv-1); mult = T0.mult + T0.lm*(lv-1);
    steps.push({src:'base', c:chips, m:mult});
    vv = TYPE[v].val; if(v === 'P' && RULE('wall')) vv = 0;
    if(vv){ steps.push({src:'victim', c:vv}); chips += vv; }
    if(check){ steps.push({src:'check', c:25, m:2}); chips += 25; mult += 2; }
  } else { chips = 25; mult = 2; steps.push({src:'base', c:25, m:2}); }
  const promo = a === 'P' && nb[to].t === 'Q';
  if(promo && victim){ steps.push({src:'promo', m:2}); mult += 2; }
  const fork = attackSquares(nb, to).filter(x => nb[x] && nb[x].side === 'en').length;
  const [fr, fc] = rc(from), [trr, tcc] = rc(to);
  const ctx = {capture:!!victim, check, a, v, vv, dist: Math.max(Math.abs(fr-trr), Math.abs(fc-tcc)), fork, before:B.caps, money:RUN.money, left:B.moves-1, promo, lost:B.lost,
    risky: attacksOn(nb, 'en').includes(to), lastOne: !!victim && nb.filter(p => p && p.side === 'en' && p.t !== 'K').length === 0, streak: B.streak > 0};
  const me = b[from];
  if(victim && hasE(me,'iron')){ mult += 4; steps.push({src:'ench', m:4}); }
  if(victim && hasE(me,'fire')){ chips += 50; steps.push({src:'ench', c:50}); }
  if(victim && hasE(me,'crystal')){ mult *= 2; steps.push({src:'ench', x:2}); }
  if(victim && a === 'K' && isC('rooftop')){ mult *= 2; steps.push({src:'circuit', x:2}); }
  if(victim && B.blitz){ chips += 40; steps.push({src:'card', c:40}); }
  if(victim && a === 'N' && B.knightBuff){ mult += B.knightBuff; steps.push({src:'card', m:B.knightBuff}); }
  if(victim && a === 'K' && B.kingX){ mult *= B.kingX; steps.push({src:'card', x:B.kingX}); }
  if(victim && B.forkX && fork){ mult += B.forkX*fork; steps.push({src:'card', m:B.forkX*fork}); }
  RUN.relics.forEach((id, k) => { const rel = R(id); if(!rel.on) return; if(!ctx.capture && !rel.check) return; const e = rel.on(ctx); if(!e) return;
    if(e.c){ chips += e.c; steps.push({src:'relic', k, c:e.c}); }
    if(e.m){ mult += e.m; steps.push({src:'relic', k, m:e.m}); }
    if(e.x){ mult *= e.x; steps.push({src:'relic', k, x:e.x}); } });
  if(victim && B.nextX){ mult *= B.nextX; steps.push({src:'card', x:B.nextX}); }
  if(victim && B.streak > 0){ const cx = comboX(B.streak); mult *= cx; steps.push({src:'combo', x:cx}); }
  if(!victim && B.checks > 0){ const f = Math.pow(0.5, Math.min(B.checks, 4)); mult *= f; steps.push({src:'fatigue', x:f}); }
  mult = Math.round(mult*10)/10;
  const label = victim ? `${T0.name} takes ${TYPE[v].name}${check ? ' + Check' : ''}` : `${T0.name} gives Check`;
  return {steps, chips, mult, total: Math.round(chips*mult), promo, check, label, fork};
}

  const log = B && B.log;
  B = null; save();
  const m = modal(`${quote}<h2 style="color:var(--mult)">You lost a life</h2><p>${why}</p>
    <div class="lifebox">${hearts(RUN.lives, true)}<span>${RUN.lives} ${RUN.lives === 1 ? 'life' : 'lives'} left. Your army, tiles and money are safe. Lose them all and the game is over.</span></div>
    <button class="btn" id="retry">Try the round again</button><button class="btn ghost" id="peek">Review the round</button><button class="btn ghost" id="home">Save and go to title screen</button>`, null);
  addPeek(m, log);
  m.querySelector('#retry').onclick = () => { m.remove(); startBlind(); };
  m.querySelector('#home').onclick = () => { m.remove(); title(); };
}
function gameOver(why){
  if(RUN && lives() > 1) return loseLife(why);
  sfx.lose();
  const bp = curPersona(); const quote = bp ? `<div class="quote">${portrait(bp)}<span>“${bp.win}”<small>${bp.name}</small></span></div>` : '';
  const reached = RUN.ante;
  if(reached > BEST.ante){ BEST.ante = reached; saveBest(); }
  const log = B && B.log;
  clearRun();
  const gm = modal(`${quote}<h2 style="color:var(--mult)">Game over</h2><p>${why}</p><p class="muted" style="margin:0;font-size:13px">That was your last life.</p>
    <div class="kv"><span>Reached</span><b>Stage ${reached}: ${stageName(reached)}</b></div>
    <div class="kv"><span>Best capture ever</span><b>${BEST.hand.toLocaleString()}</b></div>
    <button class="btn" id="again">New game</button><button class="btn ghost" id="peek">View the board</button><button class="btn ghost" id="home">Title screen</button>`, null);
  addPeek(gm, log);
  $('#again').onclick = () => { document.querySelector('.modal').remove(); circuitSelect(); };
  $('#home').onclick = () => { document.querySelector('.modal').remove(); title(); };
}

/* ---------- shop ---------- */
function rarityPick(){ const x = Math.random(); return x < 0.62 ? 'common' : x < 0.92 ? 'uncommon' : 'rare'; }
function genShop(){
  const offers = [];
  const pool = RELICS.filter(r => !RUN.relics.includes(r.id));
  for(let i=0;i<2;i++){ const rar = rarityPick(); let cands = pool.filter(r => r.r === rar && !offers.some(o => o.id === r.id)); if(!cands.length) cands = pool.filter(r => !offers.some(o => o.id === r.id)); if(cands.length) offers.push({kind:'relic', id:pick(cands).id}); }
  const rpool = ['P','P','N','N','B','B','R','R','Q'].filter(t => t !== RUN.lastRecruit || Math.random() < 0.3);
  const t1 = pick(rpool); let t2 = pick(rpool.filter(t => t !== t1)); if(!t2) t2 = 'B';
  RUN.lastRecruit = t1;
  offers.push({kind:'piece', t:t1, e: Math.random() < 0.35 ? pick(ENCH_IDS) : null});
  offers.push({kind:'piece', t:t2, e: Math.random() < 0.35 ? pick(ENCH_IDS) : null});
  offers.push({kind:'train', t:pick(['P','N','B','R','Q','K'])});
  if(Math.random() < 0.6) offers.push({kind:'forge'});
  const excl = CARDS.filter(c => c.circuit && c.circuit === RUN.circuit), gen = CARDS.filter(c => !c.circuit);
  offers.push({kind:'card', id:pick(excl.length && Math.random() < 0.55 ? excl : gen).id});
  RUN.shop = offers; RUN.inShop = true; save();
}
function forgePick(o){
  const list = RUN.roster.map((s, ri) => s ? {...parseR(s), ri} : null).filter(x => x && x.t !== 'K');
  const m = modal(`<p class="muted">${UI.forge} · $${offerCost(o)}</p><h2>Pick a piece</h2><p style="margin:0;font-size:13.5px">It gains a random new power.</p>
    <div class="forgelist">${list.map(x => { const full = eList(x.e).length >= MAX_POWERS;
      return `<button class="fpick" data-ri="${x.ri}" ${full ? 'disabled' : ''}><span class="fi">${pieceSVG(x.t,'me',x.e)}</span><span><b>${x.e ? eNames(x.e) + ' ' : ''}${TYPE[x.t].name}</b><small>${full ? 'Full (3 powers)' : eList(x.e).length ? eList(x.e).length + ' power' + (eList(x.e).length > 1 ? 's' : '') : 'No powers yet'}</small></span></button>`; }).join('')}</div>
    <button class="btn ghost" id="fcancel">Cancel</button>`, '#fcancel');
  m.querySelectorAll('[data-ri]').forEach(b => b.onclick = () => {
    const ri = +b.dataset.ri, x = parseR(RUN.roster[ri]), have = eList(x.e);
    const e = pick(ENCH_IDS.filter(z => !have.includes(z))), ne = [...have, e].join('+');
    RUN.roster[ri] = `${x.t}:${ne}`; spend(offerCost(o)); o.sold = true; checkSpell(); sfx.win(); save(); m.remove(); shop();
    showTip(`<b>${eNames(ne)} ${TYPE[x.t].name}</b><br>New power: ${ENCH[e].desc}`);
  });
}
const ORDER = ['K','Q','R','B','N','P'];
function armyStrip(){
  const list = RUN.roster.map((s, ri) => s ? {...parseR(s), ri} : null).filter(Boolean).sort((a,b) => ORDER.indexOf(a.t) - ORDER.indexOf(b.t));
  const counts = ORDER.map(t => [t, list.filter(x => x.t === t).length]).filter(x => x[1]);
  return `<div class="armystrip"><div class="lab">Your army · ${list.length}/16 ${onTitle === false && RUN.inShop ? '<em>tap a piece to release it</em>' : ''} <span>${counts.map(([t,n]) => `${n} ${TYPE[t].name}${n>1?'s':''}`).join(' · ')}</span></div>
    <div class="army">${list.map(x => `<button class="apc" data-ari="${x.ri}" aria-label="${TYPE[x.t].name}">${pieceSVG(x.t,'me',x.e)}${eList(x.e).length > 1 ? `<span class="edots">${eList(x.e).map(z => `<i style="background:${ENCH[z].col}"></i>`).join('')}</span>` : ''}</button>`).join('')}</div></div>`;
}
function releaseValue(x){ return Math.max(1, Math.floor(TYPE[x.t].cost/2)) + eList(x.e).length; }
function bindArmy(root, canRelease){
  root.querySelectorAll('[data-ari]').forEach(b => b.onclick = () => {
    const ri = +b.dataset.ari, x = parseR(RUN.roster[ri]), T0 = TYPE[x.t], lv = RUN.lv[x.t];
    const rel = canRelease && x.t !== 'K';
    showTip(`<b>${x.e ? eNames(x.e) + ' ' : ''}${T0.name}</b> <span class="lvtag">Lv.${lv}</span><br>Captures score <b class="fxc">${T0.chips + T0.lc*(lv-1)}</b> × <b class="fxm">${T0.mult + T0.lm*(lv-1)}</b>${eList(x.e).map(z => `<br><span style="color:${ENCH[z].col}">${ENCH[z].name}:</span> ${ENCH[z].desc}`).join('')}
      ${rel ? `<br><button class="btn ghost" id="relp" style="margin-top:8px;font-size:14px;padding:8px">Release it · get $${releaseValue(x)}</button>` : x.t === 'K' ? '<br><span class="muted">Your King can’t be released.</span>' : ''}`);
    const rb = document.getElementById('relp');
    if(rb) rb.onclick = e => {
      e.stopPropagation();
      if(!rb.dataset.sure){ rb.dataset.sure = 1; rb.textContent = `Tap again to release this ${T0.name}`; rb.classList.add('red'); clearTimeout(tipT); tipT = setTimeout(hideTip, 5000); return; }
      RUN.money += releaseValue(x); RUN.roster.splice(ri, 1); sfx.coin(); save(); hideTip(); shop();
    };
  });
}
function cardRow(){
  RUN.cards = RUN.cards || [];
  let h = '';
  for(let k=0;k<2;k++){ const id = RUN.cards[k];
    h += id ? `<button class="mycard" data-own="${k}" style="--cc:${C(id).col}"><small>${UI.cardShort}</small><b>${C(id).name}</b><span>Tap to view or sell</span></button>` : `<div class="mycard empty"><small>Empty card slot</small></div>`; }
  return `<div class="cardrow"><span class="lab">Your cards</span><div class="cards2">${h}</div></div>`;
}
function ownedCard(k){
  const c = C(RUN.cards[k]), sell = Math.floor(c.cost/2);
  const m = modal(`<p class="muted">Your ${UI.card}</p><h2 style="color:${c.col}">${c.name}</h2><p>${c.desc}</p>
    ${c.id === 'banker' ? `<button class="btn" id="usebank">Use now</button>` : '<p class="muted" style="font-size:13px">Play it during a round from the buttons under the board.</p>'}
    <button class="btn ghost" id="sellc">Sell for $${sell}</button><button class="btn ghost" id="closec">Close</button>`, '#closec');
  m.querySelector('#sellc').onclick = () => { RUN.money += sell; RUN.cards.splice(k,1); sfx.coin(); save(); m.remove(); shop(); };
  const ub = m.querySelector('#usebank'); if(ub) ub.onclick = () => { const g = Math.min(15, RUN.money); RUN.money += g; RUN.cards.splice(k,1); sfx.win(); save(); m.remove(); shop(); showTip(`<b>The Banker</b><br>+$${g}`); };
}
function replaceCard(newId, onDone, after){
  const n = C(newId);
  const m = modal(`<p class="muted">Your card slots are full</p><h2 style="color:${n.col}">${n.name}</h2><p>${n.desc}</p>
    <p style="margin:0">Which card should it replace?</p>
    ${RUN.cards.map((id,k) => `<button class="btn ghost rep" data-rep="${k}" style="border:2px solid ${C(id).col}">Replace ${C(id).name}</button>`).join('')}
    <button class="btn ghost" id="keepold">Keep my cards</button>`, '#keepold', after);
  m.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => { RUN.cards[+b.dataset.rep] = newId; onDone && onDone(); sfx.coin(); save(); m.remove(); after && after(); });
}
function trainCost(t){ return price(3 + Math.floor((RUN.lv[t]-1)/2)); }
function offerCost(o){ if(o.kind === 'relic') return price(R(o.id).cost); if(o.kind === 'piece') return price(TYPE[o.t].cost + (o.e ? 3 : 0)); if(o.kind === 'card') return price(C(o.id).cost); if(o.kind === 'forge') return price(5); return trainCost(o.t); }
function spend(x){ RUN.money -= x; RUN.stats = RUN.stats || {kingCaps:0, knightCaps:0, spent:0}; RUN.stats.spent += x; if(RUN.stats.spent >= 60) unlockAch('mm_spender'); }
function shop(){
  enterLand();
  document.body.dataset.circuit = (RUN && RUN.circuit) || '';
  onTitle = false;
  app.classList.remove('play');
  document.body.dataset.mood = 'calm';
  if(!RUN.shop) genShop();
  RUN.inShop = true; save();
  app.innerHTML = `<section class="screen">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:28px">${UI.shop}</h2><span style="text-align:right"><span class="money" style="font-size:26px">$${RUN.money}</span><br>${hearts(lives())}</span></div>
    <p class="muted" style="font-size:13px">${UI.tiles}: ${RUN.relics.length}/5 · Army: ${RUN.roster.filter(Boolean).length}/16 · Tap a tile you own to sell it.</p>
    ${relicRow()}
    ${cardRow()}
    ${armyStrip()}
    <div class="shopgrid">${RUN.shop.map((o, k) => {
      if(o.sold) return `<div class="offer sold"><h3>Sold</h3></div>`;
      if(o.kind === 'relic'){ const r = R(o.id); return `<div class="offer tileo ${r.r}"><span class="tagline">${r.r} ${UI.tile}</span><h3>${r.name}<span class="tileprev"><span class="relics" style="display:block"><span class="relic ${r.r}" style="display:flex;align-items:center;justify-content:center;position:relative">${relicIcon(r)}<span class="fx fx${r.fc}">${r.fx}</span></span></span></span></h3><p>${r.desc}</p><button class="btn" data-buy="${k}" ${RUN.money < offerCost(o) || RUN.relics.length >= 5 ? 'disabled' : ''}>$${offerCost(o)}</button></div>`; }
      if(o.kind === 'piece'){ const pc = offerCost(o); return `<div class="offer piece" ${o.e ? `style="border-color:${ENCH[o.e].col}"` : ''}><span class="tagline">${o.e ? UI.special : UI.recruit}</span><h3>${o.e ? `<span style="color:${ENCH[o.e].col}">${ENCH[o.e].name}</span> ` : ''}${TYPE[o.t].name}${pieceSVG(o.t,'me',o.e)}</h3><p>${o.e ? ENCH[o.e].desc : `Add a ${TYPE[o.t].name} to your army for every round.`}</p><button class="btn" data-buy="${k}" ${RUN.money < pc || RUN.roster.length >= 16 ? 'disabled' : ''}>$${pc}</button></div>`; }
      if(o.kind === 'forge') return `<div class="offer forge"><span class="tagline">${UI.forge} · ${UI.powers} stack, up to ${MAX_POWERS} per piece</span><h3>${UI.forgeAct}</h3><p>Pick any piece in your army (not the King). It gains a random new special power and keeps any it already has.</p><button class="btn" data-buy="${k}" ${RUN.money < offerCost(o) ? 'disabled' : ''}>$${offerCost(o)} · pick a piece</button></div>`;
      if(o.kind === 'card'){ const c = C(o.id); return `<div class="offer cardo" style="border-color:${c.col}"><span class="tagline">${c.circuit ? `<b style="color:${c.col}">${CIR().name} exclusive</b> · ` : ''}${UI.card} · one use · ${(RUN.cards||[]).length}/2 held</span><h3 style="color:${c.col}">${c.name}</h3><p>${c.desc}</p><button class="btn" data-buy="${k}" ${RUN.money < offerCost(o) ? 'disabled' : ''}>$${offerCost(o)}${(RUN.cards||[]).length >= 2 ? ' · swap one out' : ''}</button></div>`; }
      const t = o.t, L = RUN.lv[t];
      return `<div class="offer train ${RUN.shop.some(x => x.kind === 'forge') ? '' : 'wide'}"><span class="tagline">${UI.training}</span><h3>${TYPE[t].name} ${UI.drill}${pieceSVG(t,'me')}</h3><p>${TYPE[t].name} Lv.${L} → ${L+1}: <b class="fxc">+${TYPE[t].lc} Material</b> and <b class="fxm">+${TYPE[t].lm} Brilliance</b> on its captures.</p><button class="btn blue" data-buy="${k}" ${RUN.money < trainCost(t) ? 'disabled' : ''}>$${trainCost(t)}</button></div>`;
    }).join('')}</div>
    <div class="offer lifeo"><span class="tagline">Extra life · max ${MAX_LIVES}</span><h3><span>Buy a life</span>${hearts(1, true)}</h3><p>A second chance: if you run out of moves or get checkmated, you retry the round instead of losing everything. You have ${lives()}. Gets pricier every time.</p><button class="btn red" id="buylife" ${RUN.money < lifeCost() || lives() >= MAX_LIVES ? 'disabled' : ''}>${lives() >= MAX_LIVES ? 'Lives full' : `$${lifeCost()}`}</button></div>
    <div class="shopgrid" style="margin-bottom:8px"><button class="btn ghost" id="reroll" ${RUN.money < RUN.rerollCost ? 'disabled' : ''}>${UI.restock} $${RUN.rerollCost}</button><button class="btn" id="next">Next round</button></div>
  </section>`;
  bindRelicTips(app, k => { const r = R(RUN.relics[k]); RUN.money += Math.floor(r.cost/2); RUN.relics.splice(k,1); sfx.coin(); save(); shop(); });
  app.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const o = RUN.shop[+b.dataset.buy];
    const cost = offerCost(o);
    if(o.kind === 'relic'){ spend(cost); RUN.relics.push(o.id); }
    else if(o.kind === 'piece'){ spend(cost); RUN.roster.push(o.e ? `${o.t}:${o.e}` : o.t); checkSpell(); }
    else if(o.kind === 'forge'){ forgePick(o); return; }
    else if(o.kind === 'card'){ RUN.cards = RUN.cards || [];
      if(RUN.cards.length >= 2){ replaceCard(o.id, () => { spend(cost); o.sold = true; }, shop); return; }
      spend(cost); RUN.cards.push(o.id); }
    else { spend(cost); RUN.lv[o.t]++; }
    checkMoneyAch();
    o.sold = true; sfx.coin(); save(); shop();
  });
  app.querySelectorAll('[data-own]').forEach(b => b.onclick = () => ownedCard(+b.dataset.own));
  bindArmy(app, true);
  $('#reroll').onclick = () => { RUN.money -= RUN.rerollCost; RUN.rerollCost++; genShop(); sfx.coin(); shop(); };
  $('#buylife').onclick = () => { if(RUN.money < lifeCost() || lives() >= MAX_LIVES) return; spend(lifeCost()); RUN.lives = lives() + 1; RUN.livesBought = (RUN.livesBought || 0) + 1; sfx.win(); save(); shop(); showTip(`<b>+1 life</b><br>You now have ${RUN.lives}.`); };
  $('#next').onclick = () => { RUN.shop = null; RUN.inShop = false; blindSelect(); };
}

document.addEventListener('pointerdown', e => { const b = e.target.closest('button'); if(b && !b.disabled) sfx.ui(); }, true);
(function splash(){
  const sp = document.createElement('div'); sp.id = 'splash';
  sp.innerHTML = `<div class="sp-glow"></div><img src="${LOGO}" alt="Crownfall"><div class="sp-stripe"></div>`;
  document.body.appendChild(sp);
  let gone = false;
  const close = () => { if(gone) return; gone = true; sp.classList.add('out'); setTimeout(() => sp.remove(), 600); };
  sp.addEventListener('pointerdown', close);
  setTimeout(close, calm ? 900 : 2100);
})();
applyNames(PACK);
loadRun();
title();
setTimeout(cloudInit, 0);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && CLOUD.doc && CLOUD.timer) cloudPush(); });
})();
</script>
