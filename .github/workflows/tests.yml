# Runs every Crownfall test on each push to main and on every pull request,
# so a change that breaks something is flagged before (or right after) it goes live.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the test DOM
        run: npm install --no-save --no-package-lock happy-dom@21.0.4
      - name: Run every test
        run: |
          fail=0
          for f in validate-*.mjs validate-*.cjs audit-balance.mjs; do
            if out=$(timeout 240 node "$f" 2>&1); then
              echo "PASS  $f"
            else
              echo "FAIL  $f"; echo "$out" | tail -25 | sed 's/^/      /'; fail=1
            fi
          done
          exit $fail
